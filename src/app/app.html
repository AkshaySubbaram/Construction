@if (showShell) {
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">HC</div>
        <div>
          <strong>House Control</strong>
          <small>Project board</small>
        </div>
      </div>

      <nav class="nav-menu" aria-label="Main navigation">
        @for (item of navItems; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="sidebar-footer">
        <button class="light-button" type="button" (click)="logout()">Sign out</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <span class="topbar-label">Project overview</span>
          <h1>{{ pageTitle }}</h1>
        </div>

        <div class="user-chip">
          <span class="avatar">{{ initials() }}</span>
          <span>{{ userName() }}</span>
        </div>
      </header>

      <div class="page-content">
        <router-outlet />
      </div>
    </main>
  </div>
} @else {
  <router-outlet />
}
